<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian Online</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
  #gate {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  #gate.hidden { display: none; }
  #gate .box { max-width: 380px; width: 100%; }
  #gate h2 { margin-bottom: 16px; color: #222; }
  #gate input, #gate select {
    width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc;
    border-radius: 8px; font-size: 15px;
  }
  #gate button {
    width: 100%; padding: 12px; background: #2563eb; color: white; border: none;
    border-radius: 8px; font-size: 15px; cursor: pointer;
  }
  #gate .msg { color: #c62828; font-size: 13px; margin-top: 8px; min-height: 18px; }

  #warning-banner {
    background: #ffebee; color: #c62828; padding: 10px 16px; font-size: 14px;
    text-align: center; display: none; border-bottom: 2px solid #c62828;
  }
  #warning-banner.show { display: block; }

  #status-screen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92);
    color: white; display: none; align-items: center; justify-content: center;
    flex-direction: column; text-align: center; padding: 24px; z-index: 999;
  }
  #status-screen.show { display: flex; }
  #status-screen h1 { font-size: 22px; margin-bottom: 12px; }
  #status-screen p { font-size: 15px; opacity: 0.85; max-width: 400px; }

  iframe { flex: 1; width: 100%; border: none; display: none; }
  #quizWrap { flex: 1; display: none; flex-direction: column; }
  #quizWrap.show { display: flex; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>🔒 Masuk Ujian</h2>
    <input type="text" id="inpNama" placeholder="Nama Lengkap">
    <input type="text" id="inpNim" placeholder="NIM">
    <select id="inpKelas">
      <option value="">-- Pilih Kelas --</option>
      <option value="Asp Senin jam 13.30">Asp Senin jam 13.30</option>
      <option value="Asp Senin jam 15.30">Asp Senin jam 15.30</option>
      <option value="Asp Kamis">Asp Kamis</option>
    </select>
    <button onclick="mulaiUjian()">Masuk Ujian</button>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>

<div id="warning-banner">
  ⚠️ Kamu keluar dari halaman ujian! Pelanggaran ke-<span id="counter">0</span>. Tercatat otomatis.
</div>

<div id="status-screen">
  <h1 id="statusTitle"></h1>
  <p id="statusText"></p>
</div>

<div id="quizWrap">
  <iframe id="quizFrame"></iframe>
</div>

<script>
  // ====== GANTI DENGAN URL WEB APP BACKEND KAMU (dari Code.gs, hasil Deploy) ======
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzmlf-Z9fL1UT1-lrh7p5RMNFjy-D5W9ym47qD6oZY7VYBY5zuyAwu4naeOtjoEEq8KSg/exec";
  // ====== GANTI DENGAN LINK GOOGLE FORM KAMU ======
  const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdqSgntlukqaZBv5UzIzeX_rdTEXTdK8UD4GeFOsJQUutOnEw/viewform";

  // Entry ID hasil dari "Formulir pra-pengisian" -> dipakai buat auto-fill Nama/NIM/Kelas/Jadwal di Form
  const ENTRY_NAMA = '555334550';
  const ENTRY_NIM = '492123988';
  const ENTRY_KELAS = '1815536976';
  const ENTRY_JADWAL = '1339155667';

  // Mapping kelas -> teks Hari/Jam Ujian PERSIS sama seperti pilihan di Form (biar auto-fill cocok)
  const KELAS_KE_JADWAL_TEXT = {
    'Asp Senin jam 13.30': 'Senin, 14.15 - 14.45 (Kelas jam 13.30)',
    'Asp Senin jam 15.30': 'Senin, 15.15 - 15.45 (Kelas jam 15.30)',
    'Asp Kamis': 'Kamis, 08.15 - 08.45'
  };

  function buatUrlFormTerisi(nama, nim, kelas) {
    const jadwalText = KELAS_KE_JADWAL_TEXT[kelas] || '';
    const params = new URLSearchParams();
    params.set('usp', 'pp_url');
    params.set('embedded', 'true');
    params.set('entry.' + ENTRY_NAMA, nama);
    params.set('entry.' + ENTRY_NIM, nim);
    params.set('entry.' + ENTRY_KELAS, kelas);
    params.set('entry.' + ENTRY_JADWAL, jadwalText);
    return FORM_URL + '?' + params.toString();
  }

  let nama = "", nim = "", kelas = "";
  let locked = false;
  let pollTimer = null;
  let tungguTimer = null;
  let quizAktif = false; // pelanggaran hanya dihitung saat soal sudah terbuka (bukan di ruang tunggu)

  function tampilStatus(judul, teks) {
    document.getElementById('statusTitle').textContent = judul;
    document.getElementById('statusText').textContent = teks;
    document.getElementById('status-screen').classList.add('show');
    document.getElementById('quizWrap').classList.remove('show');
  }

  function sembunyikanStatus() {
    document.getElementById('status-screen').classList.remove('show');
  }

  async function panggilBackend(payload) {
    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' }, // hindari CORS preflight
        body: JSON.stringify(payload)
      });
      return await res.json();
    } catch (e) {
      return { ok: false, error: 'Gagal konek ke server: ' + e.message };
    }
  }

  async function mulaiUjian() {
    nama = document.getElementById('inpNama').value.trim();
    nim = document.getElementById('inpNim').value.trim();
    kelas = document.getElementById('inpKelas').value;
    const msg = document.getElementById('gateMsg');

    if (!nama || !nim || !kelas) {
      msg.textContent = 'Semua field wajib diisi!';
      return;
    }
    msg.textContent = 'Memeriksa...';

    const cek = await panggilBackend({ action: 'checkStatus', nim, kelas });
    if (!cek.ok) {
      msg.textContent = cek.error || 'Gagal memeriksa status.';
      return;
    }

    document.getElementById('gate').classList.add('hidden');

    if (cek.terkunci) {
      locked = true;
      tampilStatus('🔒 Ujian Dikunci', 'Kamu sudah keluar dari halaman ujian ' + cek.pelanggaran + ' kali sebelumnya. Hubungi pengawas/dosen untuk membuka kunci.');
      return;
    }

    const waktu = cek.waktu;
    if (waktu.status === 'bukan_hari_ujian') {
      tampilStatus('📅 Bukan Hari Ujian', 'Ujian untuk kelas ini belum dijadwalkan hari ini.');
      return;
    }
    if (waktu.status === 'belum_mulai') {
      tampilStatus('⏳ Ujian Belum Dimulai', 'Ujian akan dimulai pukul ' + String(waktu.mulaiJam).padStart(2,'0') + ':' + String(waktu.mulaiMenit).padStart(2,'0') + '. Silakan buka kembali halaman ini nanti.');
      return;
    }
    if (waktu.status === 'sudah_selesai') {
      tampilStatus('⛔ Waktu Ujian Sudah Habis', 'Sesi ujian untuk kelas ini sudah berakhir.');
      return;
    }
    if (waktu.status === 'ruang_tunggu') {
      masukRuangTunggu(waktu);
      return;
    }

    // status sedang_berlangsung -> tampilkan quiz
    bukaQuiz(cek.pelanggaran);
  }

  function bukaQuiz(pelanggaran) {
    sembunyikanStatus();
    if (pelanggaran > 0) {
      document.getElementById('counter').textContent = pelanggaran;
      document.getElementById('warning-banner').classList.add('show');
    }
    document.getElementById('quizFrame').src = buatUrlFormTerisi(nama, nim, kelas);
    document.getElementById('quizFrame').style.display = 'block';
    document.getElementById('quizWrap').classList.add('show');
    quizAktif = true; // mulai sekarang keluar-app dihitung pelanggaran

    // Cek berkala tiap 30 detik: apakah waktu habis / di-unlock ulang / di-lock dari dashboard
    pollTimer = setInterval(polling, 30000);
  }

  // Ruang tunggu: gerbang sudah buka, soal baru muncul otomatis saat jam mulai resmi
  function masukRuangTunggu(waktu) {
    let sisa = waktu.sisaDetik;
    const jamMulai = String(waktu.mulaiJam).padStart(2, '0') + ':' + String(waktu.mulaiMenit).padStart(2, '0');

    function render() {
      const m = String(Math.floor(sisa / 60)).padStart(2, '0');
      const s = String(sisa % 60).padStart(2, '0');
      tampilStatus('⏳ Ruang Tunggu', 'Ujian dimulai pukul ' + jamMulai + '. Tetap di halaman ini, soal akan terbuka otomatis. Mulai dalam ' + m + ':' + s);
    }
    render();

    let tick = 0;
    tungguTimer = setInterval(async function () {
      sisa--;
      tick++;
      if (sisa > 0) render();

      // Sinkron ke server tiap 10 detik, dan terus saat hitung mundur habis
      if (sisa <= 0 || tick % 10 === 0) {
        const cek = await panggilBackend({ action: 'checkStatus', nim, kelas });
        if (!cek.ok) return;

        if (cek.terkunci) {
          locked = true;
          clearInterval(tungguTimer);
          tampilStatus('🔒 Ujian Dikunci', 'Hubungi pengawas/dosen untuk membuka kunci.');
          return;
        }
        const st = cek.waktu.status;
        if (st === 'sedang_berlangsung') {
          clearInterval(tungguTimer);
          bukaQuiz(cek.pelanggaran);
        } else if (st === 'ruang_tunggu') {
          sisa = cek.waktu.sisaDetik;
          render();
        } else if (st === 'sudah_selesai') {
          clearInterval(tungguTimer);
          tampilStatus('⛔ Waktu Ujian Sudah Habis', 'Sesi ujian untuk kelas ini sudah berakhir.');
        }
      }
    }, 1000);
  }

  async function polling() {
    if (locked) return;
    const cek = await panggilBackend({ action: 'checkStatus', nim, kelas });
    if (!cek.ok) return;

    if (cek.terkunci) {
      locked = true;
      clearInterval(pollTimer);
      tampilStatus('🔒 Ujian Dikunci', 'Kamu sudah keluar dari halaman ujian ' + cek.pelanggaran + ' kali. Hubungi pengawas/dosen untuk membuka kunci.');
      return;
    }
    if (cek.waktu.status === 'sudah_selesai') {
      clearInterval(pollTimer);
      tampilStatus('⛔ Waktu Ujian Sudah Habis', 'Sesi ujian untuk kelas ini sudah berakhir.');
      return;
    }
  }

  async function catatPelanggaran() {
    if (locked || !nim || !quizAktif) return;
    const res = await panggilBackend({ action: 'reportViolation', nim, nama, kelas });
    if (!res.ok) return;

    document.getElementById('counter').textContent = res.pelanggaran;
    document.getElementById('warning-banner').classList.add('show');

    if (res.terkunci) {
      locked = true;
      clearInterval(pollTimer);
      tampilStatus('🔒 Ujian Dikunci', 'Kamu sudah keluar dari halaman ujian ' + res.pelanggaran + ' kali. Sesuai aturan, ujian ini dihentikan. Hubungi pengawas/dosen untuk tindak lanjut.');
    }
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && nim) catatPelanggaran();
  });
  window.addEventListener('blur', function () {
    if (nim) catatPelanggaran();
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
</script>

</body>
</html>
